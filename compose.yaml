# Databases for running the test suite locally:
#
#   docker compose up -d --wait
#   MDB2_TEST_DSN=pgsql://postgres:password@127.0.0.1:25432/mdb2_test vendor/bin/phpunit
#   MDB2_TEST_DSN=mysqli://root:password@127.0.0.1:23306/mdb2_test vendor/bin/phpunit
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mdb2_test
    ports:
      - "127.0.0.1:${MDB2_PGSQL_PORT:-25432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: mdb2_test
    ports:
      - "127.0.0.1:${MDB2_MYSQL_PORT:-23306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ppassword"]
      interval: 2s
      retries: 30
